[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2h-v2"
version = "0.1.0"
description = "Football value-betting engine — clean rebuild"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.ignore = ["I001", "PYI034", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["h2h"]
