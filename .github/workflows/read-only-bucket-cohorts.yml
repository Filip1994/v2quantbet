name: Temporary read-only Virsliga 365 ban check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify banned league disappears from public Research lists and analytics
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, time, urllib.request
          base="https://quantbet-research-production.up.railway.app"
          targets=[
            ("ACTIVE", "/research?tab=active"),
            ("AWAITING", "/research?tab=awaiting"),
            ("HISTORY", "/research?tab=history"),
            ("LEAGUE", "/research/analytics/league.json?league_id=365&season=2026"),
            ("ANALYTICS", "/research/analytics.json"),
          ]
          failure=0
          for name,path in targets:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"QuantBet-virsliga-ban-readonly/1.0"})
                  with urllib.request.urlopen(req,timeout=35) as res:
                      data=res.read(6000000).decode("utf-8","replace")
                      print("HTTP",name,res.status,"BYTES",len(data),flush=True)
                  if name in ("ACTIVE","AWAITING","HISTORY"):
                      rows=re.findall(r'(?is)<tr\b[^>]*>.*?</tr>',data)
                      blocked=[re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]*>',' ',row))).strip() for row in rows if re.search("virsliga|virslīga|liga 365",row,re.I)]
                      print("BANNED_LEAGUE_ROWS",name,len(blocked),blocked[:2],flush=True)
                      if blocked: failure+=1
                  elif name=="LEAGUE":
                      obj=json.loads(data)
                      print("LEAGUE_365_ROWS",len(obj.get("rows",[])),"N",obj.get("summary",{}).get("n"),flush=True)
                      if obj.get("rows") or int(obj.get("summary",{}).get("n",0) or 0):failure+=1
                  else:
                      obj=json.loads(data)
                      cohort=obj.get("cohorts",{}).get("league_season",[])
                      bad=[x for x in cohort if str(x.get("league_id"))=="365"]
                      print("ANALYTICS_365_COHORTS",len(bad),flush=True)
                      if bad:failure+=1
              except Exception as exc:
                  print("AUDIT_FAILED",name,type(exc).__name__,str(exc)[:180],flush=True)
                  failure+=1
          print("VIRSLIGA_BAN_AUDIT_FAILURES",failure,flush=True)
          if failure:raise SystemExit(1)
          PY
