name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantbet
          POSTGRES_PASSWORD: quantbet
          POSTGRES_DB: quantbet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantbet -d quantbet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUANTBET_TEST_DATABASE_URL: postgresql://quantbet:quantbet@localhost:5432/quantbet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run python -m ruff check .
      - name: Tests
        run: uv run python -m pytest
